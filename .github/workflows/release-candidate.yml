name: Release candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish an RC or the approved stable package
        required: true
        type: choice
        options: [rc, stable]
        default: rc
      rc_number:
        description: RC number (for example 1 for 2026.2.0-rc.1)
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: echo "RELEASE_VERSION=$(pnpm pkg get version | tr -d '\"')" >> "$GITHUB_ENV"
      - run: test "$(pnpm pkg get version | tr -d '\"')" = "$RELEASE_VERSION"
      - run: pnpm data:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: git diff --exit-code

  publish-rc:
    needs: verify
    if: inputs.channel == 'rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: echo "RELEASE_VERSION=$(pnpm pkg get version | tr -d '\"')" >> "$GITHUB_ENV"
      - run: pnpm changeset pre enter rc
      - run: npm version "$RELEASE_VERSION-rc.${{ inputs.rc_number }}" --no-git-tag-version
      - run: pnpm build
      - name: Publish RC if needed
        run: |
          version="$RELEASE_VERSION-rc.${{ inputs.rc_number }}"
          if npm view "@aivangogh/ph-address@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@$version is already published"
          else
            npm publish --tag next --access public
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test published RC
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm test:published -- "@aivangogh/ph-address@$RELEASE_VERSION-rc.${{ inputs.rc_number }}" && exit 0
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1
      - name: Create RC GitHub release if needed
        run: |
          tag="v$RELEASE_VERSION-rc.${{ inputs.rc_number }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$tag already exists"
          else
            gh release create "$tag" --repo "${{ github.repository }}" --prerelease --title "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish-stable:
    needs: verify
    if: inputs.channel == 'stable' && github.ref == 'refs/heads/main'
    environment: npm-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: echo "RELEASE_VERSION=$(pnpm pkg get version | tr -d '\"')" >> "$GITHUB_ENV"
      - run: test "$(pnpm pkg get version | tr -d '\"')" = "$RELEASE_VERSION"
      - run: pnpm build
      - name: Publish stable if needed
        run: |
          if npm view "@aivangogh/ph-address@$RELEASE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@$RELEASE_VERSION is already published"
          else
            npm publish --tag latest --access public
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test published stable package
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm test:published -- "@aivangogh/ph-address@$RELEASE_VERSION" && exit 0
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1
      - name: Create stable GitHub release if needed
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$tag already exists"
          else
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
